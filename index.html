<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <title>조현주 React 포트폴리오</title>
    <meta name="description" content="웹 퍼블리셔 조현주의 React 포트폴리오입니다. 웹 에이전시에서 진행한 52개 프로젝트와 작업 내용을 소개합니다." />

    <!-- 파비콘 -->
    <link rel="icon" type="image/x-icon" href="/img/common/favicon.ico" />
    <!-- 파비콘 -->

    <!-- Open Graph (SNS 공유 시 미리보기) : og:image, og:url은 절대 경로 필요 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="조현주 React 포트폴리오" />
    <meta property="og:description" content="웹 퍼블리셔 조현주의 React 포트폴리오입니다. 웹 에이전시에서 진행한 52개 프로젝트와 작업 내용을 소개합니다." />
    <meta property="og:url" content="https://johyunjoo99.github.io/react-portfolio/" />
    <meta property="og:image" content="https://johyunjoo99.github.io/react-portfolio/img/common/ogimg.jpg" />
    <!-- Open Graph -->

    <script>
      const redirect = sessionStorage.redirect;
    
      if (redirect) {
        delete sessionStorage.redirect;
    
        const base = '/react-portfolio';
    
        window.history.replaceState(
          null,
          null,
          base + redirect
        );
      }
    </script>

    <script>
      //screen scale
      let windowWidth = window.screen.width;
      setViewPort(windowWidth);

      function setViewPort(w_width) {
          const viewport = document.querySelector('meta[name="viewport"]');

          if (w_width <= 480) {
              viewport.setAttribute(
              "content",
              "width=480, maximum-scale=2.0, user-scalable=yes"
              );
          } else {
              viewport.setAttribute(
              "content",
              "width=device-width, initial-scale=1.0, maximum-scale=2.0, minimum-scale=1.0, user-scalable=yes"
              );
          }
      }

      window.addEventListener("resize", function () {
          windowWidth = window.screen.width;
          setViewPort(windowWidth);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
